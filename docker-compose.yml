version: '3.8'

services:

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: root
      POSTGRES_PASSWORD: bunty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin Database Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - ecommerce-net
    depends_on:
      - postgres-db

  # Spring Boot Backend API Service
  ecommerce-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:5432/ecommerce
      - USERNAME=root
      - PASS=bunty
      - DB=ecommerce
      - PORT=8081
      - TOKEN=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      - EXPIRY=86400000
    networks:
      - ecommerce-net
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  ecommerce-net:
    driver: bridge
